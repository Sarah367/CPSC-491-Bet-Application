name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-id:
    name: Build Identifier
    runs-on: ubuntu-latest
    outputs:
      build-id: ${{ steps.compute.outputs.build-id }}
    steps:
      - name: Compute build identifier
        id: compute
        run: |
          BUILD_ID="build-${{ github.run_number }}-$(echo '${{ github.sha }}' | cut -c1-7)"
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Build identifier: $BUILD_ID"
          {
            echo "### Build identifier"
            echo
            echo "\`$BUILD_ID\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Run number | ${{ github.run_number }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Ref | ${{ github.ref_name }} |"
            echo "| Event | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (Lint, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          # Dummy values: tests mock firebase/auth, but firebase.js still
          # calls getAuth() at import time and needs non-empty config to
          # avoid throwing "auth/invalid-api-key". No real Firebase project
          # is ever contacted.
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      - run: npm run build
